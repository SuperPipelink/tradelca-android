# Compila los APK en la nube de GitHub: no hace falta instalar Android Studio.
# Se ejecuta con cada subida a main o a mano desde la pestaña Actions (botón «Run workflow»).
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        proyecto: [hola-tradelca, tradelca-ingresos]
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK de Android
        uses: android-actions/setup-android@v3
        with:
          # El paquete «tools» que instala por defecto ya no existe; se piden solo los necesarios
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Pruebas unitarias
        working-directory: ${{ matrix.proyecto }}
        run: gradle testDebugUnitTest --no-daemon

      - name: Compilar el APK
        working-directory: ${{ matrix.proyecto }}
        run: gradle assembleDebug --no-daemon

      - name: Guardar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.proyecto }}-apk
          path: ${{ matrix.proyecto }}/app/build/outputs/apk/debug/*.apk

  publicar:
    # Deja los APK a la mano: como versión descargable (Releases) y en la rama «apk»
    needs: apk
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
      - name: Ordenar los APK
        run: |
          mkdir -p salida
          cp apks/hola-tradelca-apk/app-debug.apk salida/hola-tradelca.apk
          cp apks/tradelca-ingresos-apk/app-debug.apk salida/tradelca-ingresos.apk
          ls -la salida
      - name: Publicar como versión «apk-ultima»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-ultima --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create apk-ultima salida/*.apk -R "$GITHUB_REPOSITORY" \
            --title "APK de la Guía 8" --notes "Compilados por GitHub Actions desde el commit ${GITHUB_SHA::7}."
      - name: Guardar en la rama apk
        run: |
          cd salida
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.apk
          git commit -q -m "APK compilados desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk
