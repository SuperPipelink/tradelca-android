# Compila los APK en la nube de GitHub: no hace falta instalar Android Studio.
# Se ejecuta con cada subida a main o a mano desde la pestaña Actions (botón «Run workflow»).
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        proyecto: [hola-tradelca, tradelca-ingresos]
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK de Android
        uses: android-actions/setup-android@v3

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Pruebas unitarias
        working-directory: ${{ matrix.proyecto }}
        run: gradle testDebugUnitTest --no-daemon

      - name: Compilar el APK
        working-directory: ${{ matrix.proyecto }}
        run: gradle assembleDebug --no-daemon

      - name: Guardar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.proyecto }}-apk
          path: ${{ matrix.proyecto }}/app/build/outputs/apk/debug/*.apk
